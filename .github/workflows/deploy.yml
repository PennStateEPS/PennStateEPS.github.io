name: Deploy IEEE EPS website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_BUILDER_API_KEY: ${{ vars.VITE_BUILDER_API_KEY }}
          VITE_GOOGLE_CALENDAR_ID: ${{ vars.VITE_GOOGLE_CALENDAR_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_CALENDAR_PUBLIC_URL: ${{ vars.VITE_CALENDAR_PUBLIC_URL }}
          VITE_FORMSPREE_CONTACT_ID: ${{ vars.VITE_FORMSPREE_CONTACT_ID }}
          VITE_FORMSPREE_SPONSOR_ID: ${{ vars.VITE_FORMSPREE_SPONSOR_ID }}
          VITE_FORMSPREE_JOIN_ID: ${{ vars.VITE_FORMSPREE_JOIN_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - id: deployment
        uses: actions/deploy-pages@v4
